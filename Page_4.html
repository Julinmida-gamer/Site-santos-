<h3>🎵 Hino do Santos FC 🎵</h3>

    <audio id="musica" autoplay loop>
        <source src="santos.mp4" type="audio/mp4">
    </audio>

    <button onclick="toggleAudio()" id="botaoAudio">
        ⏸️ Pausar Música
    </button>

    <script>
        const audio = document.getElementById("musica");
        const botao = document.getElementById("botaoAudio");

        function toggleAudio() {
            if(audio.paused){
                audio.play();
                botao.innerHTML = "⏸️ Pausar Hino";
            }else{
                audio.pause();
                botao.innerHTML = "▶️ Tocar Hino";
            }
        }
    </script>
